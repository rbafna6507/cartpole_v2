[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-vision3-baseline"
version = "0.1.0"
description = "Preserved observe-only vision3 dashboard and encoder comparison"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5", "Flask>=3,<4"]

[dependency-groups]
dev = ["pyserial>=3.5,<4"]

[project.scripts]
vision3 = "pendulum_vision.live:main"

[tool.setuptools.packages.find]
include = ["pendulum_vision*"]

[tool.setuptools.package-data]
pendulum_vision = ["*.html", "*.js"]

[tool.uv]
default-groups = []

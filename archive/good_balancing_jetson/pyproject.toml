[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-baseline-console"
version = "0.1.0"
description = "Portable launcher for the preserved tuned cartpole console"
requires-python = ">=3.11,<3.13"
dependencies = ["pyserial>=3.5,<4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[dependency-groups]
dev = ["matplotlib>=3.8,<4"]

[project.scripts]
cartpole-console = "launch:main"

[tool.setuptools]
package-dir = {"" = "console"}
py-modules = ["cartpole", "angle_plot", "console_preset", "vision_telemetry", "launch"]

[tool.uv]
default-groups = []

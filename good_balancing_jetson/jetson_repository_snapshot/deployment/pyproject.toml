[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-deploy"
version = "0.1.0"
description = "Teensy cart-pendulum SDK, MuJoCo environment, and system identification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
sim = ["mujoco>=3.2,<4", "gymnasium>=1,<2"]
serial = ["pyserial>=3.5,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
cartpole-deploy = "cartpole_deploy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

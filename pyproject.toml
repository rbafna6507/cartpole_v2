[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-sdk"
version = "0.1.0"
description = "Source-explicit cartpole policy contracts, recordings and local replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cartpole-v2 = "cartpole_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
